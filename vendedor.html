<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BinaryShop - Vendedor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h2>BinaryShop - Panel de Vendedor</h2>
        <div class="nav-links">
            <span id="userGreeting" style="margin-right: 15px;"></span>
            <button onclick="logout()">Cerrar Sesión</button>
        </div>
    </header>

    <div class="container">
        <div style="background: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <h3>Publicar Nuevo Producto</h3>
            <form onsubmit="addProduct(event)">
                <div class="form-group"><label>Nombre</label><input type="text" id="newProdName" required></div>
                <div class="form-group"><label>Precio ($)</label><input type="number" id="newProdPrice" step="0.01" required></div>
                <div class="form-group"><label>URL de la Imagen</label><input type="url" id="newProdImg" required placeholder="https://..."></div>
                <button type="submit" class="btn">Publicar</button>
            </form>
        </div>

        <div id="editFormContainer" class="hidden" style="background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ccc;">
            <h3 style="color: var(--primary);">Editar Producto</h3>
            <form onsubmit="saveEdit(event)">
                <input type="hidden" id="editId">
                <div class="form-group"><label>Nombre</label><input type="text" id="editName" required></div>
                <div class="form-group"><label>Precio ($)</label><input type="number" id="editPrice" step="0.01" required></div>
                <div class="form-group"><label>URL de la Imagen</label><input type="url" id="editImg" required></div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-warning">Guardar Cambios</button>
                    <button type="button" class="btn btn-danger" onclick="cancelEdit()">Cancelar</button>
                </div>
            </form>
        </div>

        <h3>Mis Productos Publicados</h3>
        <table>
            <thead><tr><th>Imagen</th><th>Nombre</th><th>Precio</th><th>Acciones</th></tr></thead>
            <tbody id="sellerBody"></tbody>
        </table>
    </div>

    <script src="data.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'vendedor') window.location.href = 'index.html';
        document.getElementById('userGreeting').innerText = `Hola, ${currentUser.username}`;

        function renderProducts() {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const body = document.getElementById('sellerBody');
            body.innerHTML = '';
            products.filter(p => p.seller === currentUser.username).forEach(p => {
                body.innerHTML += `
                    <tr>
                        <td><img src="${p.img}" width="50" style="border-radius:4px;"></td>
                        <td>${p.name}</td>
                        <td>$${p.price.toFixed(2)}</td>
                        <td>
                            <button class="btn btn-warning" onclick="editProduct(${p.id})" style="padding: 5px; margin-right: 5px;">Editar</button>
                            <button class="btn btn-danger" onclick="deleteProduct(${p.id})" style="padding: 5px;">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }
        renderProducts();

        function addProduct(e) {
            e.preventDefault();
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
            products.push({
                id: newId,
                name: document.getElementById('newProdName').value,
                price: parseFloat(document.getElementById('newProdPrice').value),
                img: document.getElementById('newProdImg').value,
                seller: currentUser.username
            });
            localStorage.setItem('products', JSON.stringify(products));
            e.target.reset();
            renderProducts();
            alert('Producto publicado con éxito.');
        }

        function editProduct(id) {
            const products = JSON.parse(localStorage.getItem('products'));
            const p = products.find(prod => prod.id === id);
            document.getElementById('editFormContainer').classList.remove('hidden');
            document.getElementById('editId').value = p.id;
            document.getElementById('editName').value = p.name;
            document.getElementById('editPrice').value = p.price;
            document.getElementById('editImg').value = p.img;
            document.getElementById('editFormContainer').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('editFormContainer').classList.add('hidden');
        }

        function saveEdit(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('editId').value);
            const products = JSON.parse(localStorage.getItem('products'));
            const idx = products.findIndex(p => p.id === id);
            if (idx > -1) {
                products[idx].name = document.getElementById('editName').value;
                products[idx].price = parseFloat(document.getElementById('editPrice').value);
                products[idx].img = document.getElementById('editImg').value;
                localStorage.setItem('products', JSON.stringify(products));
                cancelEdit();
                renderProducts();
                alert('Producto actualizado con éxito.');
            }
        }

        function deleteProduct(id) {
            if (confirm('¿Estás seguro de eliminar este producto?')) {
                let products = JSON.parse(localStorage.getItem('products'));
                products = products.filter(p => p.id !== id);
                localStorage.setItem('products', JSON.stringify(products));
                renderProducts();
            }
        }
    </script>
</body>
</html>
