<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BinaryShop - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 5rem;">
        <h2 style="text-align: center; color: var(--primary);">BinaryShop</h2>
        <h3>Iniciar Sesión</h3>
        <p style="font-size: 0.8rem; color: #666;">
            Comprador: <b>comprador</b> / <b>123</b><br>
            Vendedor: <b>vendedor</b> / <b>123</b><br>
            Admin: <b>admin</b> / <b>admin</b>
        </p>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Nickname</label>
                <input type="text" id="loginUser" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="loginPass" required>
            </div>
            <button type="submit" class="btn">Ingresar</button>
        </form>
    </div>

    <script src="data.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            // Validación directa consultando el arreglo estático predefinido en código
            const found = USERS.find(u => u.username === user && u.password === pass);

            if (found) {
                localStorage.setItem('currentUser', JSON.stringify(found));
                if (found.role === 'comprador') window.location.href = 'comprador.html';
                else if (found.role === 'vendedor') window.location.href = 'vendedor.html';
                else if (found.role === 'administrador') window.location.href = 'admin.html';
            } else {
                alert('Credenciales incorrectas');
            }
        }
    </script>
</body>
</html>
