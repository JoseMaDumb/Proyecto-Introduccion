<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BinaryShop - Comprador</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h2>BinaryShop - Tienda</h2>
        <div class="nav-links">
            <span id="userGreeting" style="margin-right: 15px;"></span>
            <button onclick="switchTab('store')">Catálogo</button>
            <button onclick="switchTab('cart')">Carrito (<span id="cartCount">0</span>)</button>
            <button onclick="logout()">Cerrar Sesión</button>
        </div>
    </header>

    <div id="storeView" class="container">
        <h2>Catálogo de Productos</h2>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar productos..." onkeyup="filterProducts()">
        </div>
        <div id="catalogGrid" class="product-grid"></div>
    </div>

    <div id="cartView" class="container hidden">
        <h2>Mi Carrito</h2>
        <table>
            <thead>
                <tr><th>Producto</th><th>Precio</th><th>Acción</th></tr>
            </thead>
            <tbody id="cartBody"></tbody>
        </table>
        <h3 style="text-align: right;">Total: $<span id="cartTotal">0.00</span></h3>
        <button class="btn btn-success" onclick="goToCheckout()">Proceder al Pago</button>
    </div>

    <div id="checkoutView" class="container hidden">
        <h2>Pasarela de Pago</h2>
        <h3>Total a Pagar: $<span id="checkoutTotal">0.00</span></h3>
        <form onsubmit="processPayment(event)">
            <div class="form-group"><label>Dirección de Envío</label><input type="text" required placeholder="Ej: Calle Principal 123"></div>
            <h4>Datos Bancarios</h4>
            <div class="form-group"><label>Nombre en la Tarjeta</label><input type="text" required placeholder="Nombre Apellido"></div>
            <div class="form-group"><label>Número de Tarjeta</label><input type="text" required pattern="\d{16}" placeholder="16 dígitos"></div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;"><label>Expiración</label><input type="text" required placeholder="MM/AA"></div>
                <div class="form-group" style="flex: 1;"><label>CVV</label><input type="text" required pattern="\d{3,4}" placeholder="123"></div>
            </div>
            <button type="submit" class="btn btn-success" style="margin-top: 15px;">Confirmar Pago</button>
            <button type="button" class="btn btn-danger" style="margin-top: 10px;" onclick="switchTab('cart')">Cancelar</button>
        </form>
    </div>

    <script src="data.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'comprador') window.location.href = 'login.html';
        document.getElementById('userGreeting').innerText = `Hola, ${currentUser.username}`;

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
        }
        updateCartCount();

        function switchTab(view) {
            document.getElementById('storeView').classList.add('hidden');
            document.getElementById('cartView').classList.add('hidden');
            document.getElementById('checkoutView').classList.add('hidden');
            
            if (view === 'store') {
                document.getElementById('storeView').classList.remove('hidden');
                renderCatalog();
            } else if (view === 'cart') {
                document.getElementById('cartView').classList.remove('hidden');
                renderCart();
            }
        }

        function renderCatalog(filter = '') {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = '';
            products.filter(p => p.name.toLowerCase().includes(filter.toLowerCase())).forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p style="color: var(--success); font-weight: bold;">$${p.price.toFixed(2)}</p>
                        <p style="font-size: 12px; color: #777;">Vendedor: ${p.seller}</p>
                        <button class="btn" onclick="addToCart(${p.id})">Añadir al Carrito</button>
                    </div>
                `;
            });
        }
        renderCatalog();

        function filterProducts() {
            renderCatalog(document.getElementById('searchInput').value);
        }

        function addToCart(id) {
            const products = JSON.parse(localStorage.getItem('products'));
            const prod = products.find(p => p.id === id);
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push(prod);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            alert(`${prod.name} añadido al carrito.`);
        }

        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const body = document.getElementById('cartBody');
            body.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                body.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>$${item.price.toFixed(2)}</td>
                        <td><button class="btn btn-danger" onclick="removeFromCart(${index})" style="padding: 5px;">Quitar</button></td>
                    </tr>
                `;
            });
            document.getElementById('cartTotal').innerText = total.toFixed(2);
        }

        function removeFromCart(index) {
            const cart = JSON.parse(localStorage.getItem('cart'));
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            renderCart();
        }

        function goToCheckout() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) { alert('El carrito está vacío'); return; }
            document.getElementById('cartView').classList.add('hidden');
            document.getElementById('checkoutView').classList.remove('hidden');
            document.getElementById('checkoutTotal').innerText = document.getElementById('cartTotal').innerText;
        }

        function processPayment(e) {
            e.preventDefault();
            alert('¡Pago procesado con éxito!');
            localStorage.setItem('cart', JSON.stringify([]));
            updateCartCount();
            switchTab('store');
        }
    </script>
</body>
</html>
